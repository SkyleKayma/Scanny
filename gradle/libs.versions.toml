[versions]
# Android
compileSdk = "34"
targetSdk = "34"
minSdk = "24"

# Libraries
kotlinVersion = "1.9.23"

androidxCore = "1.13.1"
androidxActivity = "1.9.0"

composeBom = "2024.05.00"
composeCompiler = "1.5.13"
composeNavigation = "2.7.7"
accompanist = "0.34.0"

hilt = "2.51.1"
hiltNavigation = "1.2.0"

timber = "5.0.1"
room = "2.6.1"
datastore = "1.1.1"
camera = "1.3.3"
mlkit = "17.2.0"
lifecycle = "2.7.0"
firebaseBom = "33.0.0"
splashscreen = "1.0.1"

junit = "4.13.2"
androidxTestExtJunit = "1.1.5"
espressoCore = "3.5.1"

# Plugins
gradlePlugin = "8.1.4"
googleServicesPlugin = "4.4.1"
kspPlugin = "1.9.23-1.0.20"
firebaseCrashlyticsPlugin = "3.0.1"
firebaseAppdistributionPlugin = "5.0.0"
easylauncherPlugin = "6.1.0"

[libraries]

# Android
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

# Lifecycle
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

# Timber
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }

# Accompanist
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Camera2
camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }

# ML Kit
mlkit = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit" }

# SplashScreen
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Tests
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-androidx-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExtJunit" }
test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Plugins
plugin-gradle = { module = "com.android.tools.build:gradle", version.ref = "gradlePlugin" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinVersion" }
plugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "kspPlugin" }
plugin-googleServices = { module = "com.google.gms:google-services", version.ref = "googleServicesPlugin" }
plugin-hilt = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
plugin-firebaseCrashlytics = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
plugin-firebaseAppdistribution = { module = "com.google.firebase:firebase-appdistribution-gradle", version.ref = "firebaseAppdistributionPlugin" }
plugin-easylauncher = { module = "com.project.starter:easylauncher", version.ref = "easylauncherPlugin" }

[bundles]
android = ["androidx-core", "androidx-activity"]
androidx-lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel", "androidx-lifecycle-process", "androidx-lifecycle-runtime-compose"]
compose = ["compose-ui", "compose-ui-graphics", "compose-tooling-preview", "compose-material3", "compose-material-icons-extended", "compose-navigation"]
firebase = ["firebase-crashlytics"]
accompanist = ["accompanist-permissions", "accompanist-systemuicontroller"]
datastore = ["datastore", "datastore-preferences"]
camera = ["camera2", "camera-lifecycle", "camera-core", "camera-extensions", "camera-view"]